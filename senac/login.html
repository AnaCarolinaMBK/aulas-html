<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página inicial do SENAC com formulário de login.">
    <meta name="author" content="Ana Carolina">
    <title>Primeira Página - SENAC</title>
    <link rel="shortcut icon" href="livro.png" type="image/x-icon">
    <link rel="stylesheet" href="css/visao.css">
</head>

<body>

    <h1>SENAC</h1>

<h2>Fazer login</h2>

<form action="cursos.html" method="get">
    <label for="email">E-mail:</label>
    <br>
    <input type="email" id="email" name="email"
           placeholder="Digite seu e-mail" required>

    <br><br>

    <label for="senha">Senha:</label>
    <br>
    <input type="password" id="senha" name="senha"
           placeholder="Digite sua senha" required>

    <br><br>

    <button type="submit">Entrar</button>

    <p>
    <a href="esqueci_senha.html">Esqueceu sua senha?</a>
</p>
</form>

</body>
</html>
