
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Sistema SENAC</title>

    <link rel="stylesheet" href="css/visual.css">
</head>

<body>

    <a href="index.html" class="voltar">← Voltar</a>

    <h2>Cadastro de Usuário</h2>

    <form id="formCadastro">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome"
            placeholder="Digite seu nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"
            placeholder="Digite seu e-mail" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone"
            placeholder="Digite seu telefone" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha"
            placeholder="Digite sua senha" required>

        <label for="data">Data de nascimento:</label>
        <input type="date" id="data" name="data" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade"
            placeholder="Calculada automaticamente" readonly required>

        <p><strong>Sexo:</strong></p>

        <input type="radio" id="feminino" name="sexo"
            value="Feminino" required>
        <label for="feminino">Feminino</label>

        <input type="radio" id="masculino" name="sexo"
            value="Masculino">
        <label for="masculino">Masculino</label>

        <p><strong>Interesses:</strong></p>

        <input type="checkbox" id="tecnologia" name="interesses"
            value="Tecnologia">
        <label for="tecnologia">Tecnologia</label>

        <input type="checkbox" id="esportes" name="interesses"
            value="Esportes">
        <label for="esportes">Esportes</label>

        <br><br>

        <label for="foto">Foto:</label>
        <input type="file" id="foto" name="foto" accept="image/*">

        <br><br>

        <input type="submit" value="Cadastrar">
        <input type="reset" value="Limpar">

    </form>

    <script>

        // CALCULAR IDADE 

        document.getElementById("data").addEventListener("change", function() {

            let valor = this.value;
            let campoIdade = document.getElementById("idade");

            if (!valor) {
                campoIdade.value = "";
                return;
            }

            let nascimento = new Date(valor + "T00:00:00");
            let hoje = new Date();

            if (nascimento > hoje) {
                campoIdade.value = "";
                alert("A data de nascimento não pode ser futura!");
                this.value = "";
                return;
            }

            let idade = hoje.getFullYear() - nascimento.getFullYear();

            let mes = hoje.getMonth() - nascimento.getMonth();

            if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
                idade--;
            }

            campoIdade.value = idade;

        });


        // CADASTRAR USUÁRIO

        document.getElementById("formCadastro").addEventListener("submit", function(event) {

            event.preventDefault();

            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;
            let telefone = document.getElementById("telefone").value;
            let senha = document.getElementById("senha").value;
            let idade = document.getElementById("idade").value;
            let data = document.getElementById("data").value;

            let sexo = document.querySelector('input[name="sexo"]:checked');

            let interesses = document.querySelectorAll('input[name="interesses"]:checked');

            let listaInteresses = [];

            interesses.forEach(function(item) {
                listaInteresses.push(item.value);
            });

            let foto = document.getElementById("foto").files[0];

            // VERIFICAR SE A IDADE FOI CALCULADA

            if (idade === "") {
                alert("Informe uma data de nascimento válida!");
                return;
            }

            // RECUPERAR USUÁRIOS SALVOS

            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            // CRIAR OBJETO DO USUÁRIO

            usuarios.push({
                nome: nome,
                email: email,
                telefone: telefone,
                senha: senha,
                idade: idade,
                data: data,
                sexo: sexo ? sexo.value : "Não informado",
                interesses: listaInteresses.join(", "),
                foto: foto ? foto.name : "Não enviada"
            });

            // SALVAR NO LOCALSTORAGE

            localStorage.setItem("usuarios", JSON.stringify(usuarios));


            alert("Cadastro realizado com sucesso! Você será direcionado para o Login.");

            this.reset();

            window.location.href = "login.html";

        });

    </script>

</body>
</html>
